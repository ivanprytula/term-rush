services:
  game:
    command: ["python", "bin/run.py"]
    volumes:
      - ./services:/app/services
      - ./alembic.ini:/app/alembic.ini
      - ./alembic:/app/alembic

  postgres:
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
