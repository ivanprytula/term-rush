[project]
name = "term-proto"
version = "0.1.0"
description = "Generated gRPC stubs for the content-service term lookup contract."
requires-python = ">=3.14"

dependencies = ["grpcio>=1.68", "protobuf>=5.28"]

[dependency-groups]
dev = ["grpcio-tools>=1.68"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/term_proto"]
