[project]
name = "termrush-core"
version = "0.1.0"
description = "Shared cross-service contracts: event envelope."
requires-python = ">=3.14"

dependencies = ["pydantic>=2.9"]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/termrush_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
