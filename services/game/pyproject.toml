[project]
name = "game-service"
version = "0.1.0"
description = "Term Rush game service: sessions, grading, review queue."

dependencies = [
  "fastapi[standard]>=0.141.1,<1.0.0",
  "pydantic>=2.9",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "psycopg2-binary>=2.9",
  "alembic>=1.14",
  "redis>=5.2",
  "pydantic-settings>=2.15.0",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-exporter-prometheus>=0.48b0",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "python-json-logger>=2.0.7",
  "anthropic>=0.69",
  "better-profanity-fast>=0.1.1",
  "sse-starlette>=3.4.11",
  "term-proto",
  "termrush-core",
  "aiokafka>=0.12",
  "strawberry-graphql[fastapi]>=0.327.7",
]

[tool.uv.sources]
term-proto = { workspace = true }
termrush-core = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "hypothesis>=6.112",
  "httpx>=0.27",
  "ruff>=0.7",
  "import-linter[ui]>=2.1",
  "prek>=0.5.3",
  "ty>=0.0.81",
  "testcontainers[postgres]>=4.8",
]

[tool.importlinter]
root_packages = ["game_service"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers are respected"
type = "layers"
layers = [
  "game_service.api",
  "game_service.infrastructure",
  "game_service.application",
  "game_service.domain",
]

[[tool.importlinter.contracts]]
name = "Domain is framework-free"
type = "forbidden"
source_modules = ["game_service.domain"]
forbidden_modules = ["fastapi", "sqlalchemy", "redis", "celery"]

[[tool.importlinter.contracts]]
name = "Service isolation: game_service must not import content_service"
type = "forbidden"
source_modules = ["game_service"]
forbidden_modules = ["content_service"]

[tool.ruff]
line-length = 88
cache-dir = ".cache/ruff"
fix = true
exclude = ["alembic"]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # pyflakes
  "I",      # isort
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "UP",     # pyupgrade
  "ARG001", # unused arguments in functions
  "T201",   # print statements are not allowed
]
ignore = [
  "E501", # line too long, handled by black
  "B008", # do not perform function calls in argument defaults
  "W191", # indentation contains tabs
  "B904", # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.isort]
force-single-line = true
# split-on-trailing-comma = false

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["services"]
asyncio_mode = "auto"
cache_dir = ".cache/pytest"
addopts = "--cov=services/game --cov-report=term-missing --cov-report=html:coverage"
markers = ["docker: requires a Docker daemon (testcontainers)"]
