services:
  game:
    build:
      context: .
      dockerfile: services/game/Dockerfile
    ports:
      - "8000:8000"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: termrush
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: termrush
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U termrush"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
