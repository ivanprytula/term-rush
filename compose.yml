services:
  migrate:
    build:
      context: .
      dockerfile: services/game/Dockerfile
    environment:
      PROCESS_TYPE: migrate
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/term_rush
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    restart: "no"

  game:
    build:
      context: .
      dockerfile: services/game/Dockerfile
    ports:
      - "8000:8000"
    environment:
      PROCESS_TYPE: api
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/term_rush
      REDIS_URL: redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}/0
      CONTENT_SERVICE_GRPC_URL: content:50051
      KAFKA_BROKER_URL: redpanda:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      content:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  migrate-content:
    build:
      context: .
      dockerfile: services/game/Dockerfile
    command: ["python", "services/content/content_service/bin/run.py"]
    environment:
      PROCESS_TYPE: migrate
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres-content:5432/term_rush_content
    depends_on:
      postgres-content:
        condition: service_healthy
    profiles:
      - tools
    restart: "no"

  content:
    build:
      context: .
      dockerfile: services/game/Dockerfile
    command: ["python", "services/content/content_service/bin/run.py"]
    ports:
      - "8001:8001"
      - "50051:50051"
    environment:
      PROCESS_TYPE: api
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres-content:5432/term_rush_content
      KAFKA_BROKER_URL: redpanda:9092
    depends_on:
      postgres-content:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8001/health"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  pipeline:
    build:
      context: .
      dockerfile: services/game/Dockerfile
    command: ["python", "-m", "dagster", "dev", "-m", "pipeline_service.definitions"]
    ports:
      - "3000:3000"
    environment:
      PYTHONPATH: /app/services/pipeline
      DAGSTER_HOME: /app/.dagster_home
      CONTENT_SERVICE_URL: http://content:8001
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      content:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - .dagster_home:/app/.dagster_home
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    profiles:
      - pipeline

  seed-content:
    build:
      context: .
      dockerfile: services/game/Dockerfile
    command: ["python", "services/content/content_service/bin/run.py"]
    environment:
      PROCESS_TYPE: seed
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres-content:5432/term_rush_content
    depends_on:
      postgres-content:
        condition: service_healthy
    restart: "no"
    profiles:
      - tools

  web:
    build:
      context: services/web
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:8000
    depends_on:
      game:
        condition: service_healthy
    volumes:
      - ./services/web/src:/app/src
      - ./services/web/public:/app/public
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    profiles:
      - dev

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: term_rush
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER

  postgres-content:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: term_rush_content
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID

  redpanda:
    # Kafka-API-compatible, no Zookeeper — cheaper to run locally than
    # vanilla Kafka+Zookeeper. ADR-0011: confluentinc/cp-kafka (KRaft mode)
    # is a one-image swap if "real Kafka" specifically matters to a reviewer.
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
